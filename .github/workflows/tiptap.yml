name: Tiptap compatibility

on: [push, pull_request]

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/tiptap
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun collaboration.mjs
      - run: bun markdown.mjs
