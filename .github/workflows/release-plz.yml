name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  publish:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'next' &&
      vars.RELEASE_PLZ_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Check package licenses
        run: |
          cargo metadata --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          jq -r '.packages[] | select(.publish != []) | [.name, .license] | @tsv' \
            "$RUNNER_TEMP/metadata.json" > "$RUNNER_TEMP/licenses.tsv"
          while IFS=$'\t' read -r package license; do
            if [[ "$license" != MIT ]]; then
              echo "$package must declare the MIT license" >&2
              exit 1
            fi
            if ! cargo package --list -p "$package" | grep -Fx LICENSE > /dev/null; then
              echo "$package must include LICENSE" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/licenses.tsv"
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5
        with:
          command: release
          config: .github/release-publish.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
