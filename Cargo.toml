[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/gpdoc/examples/editor",
    "crates/gpdoc/examples/editor/fonts",
    "plugins/*",
    "tests/plugins",
    "tests/gpui",
    "web/playground",
]

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
documentation = "https://gpdoc.dev/docs/quickstart/"
homepage = "https://gpdoc.dev"
repository = "https://github.com/hhhjin/gpdoc"

[workspace.dependencies]
gpdoc-demo-fonts = { path = "crates/gpdoc/examples/editor/fonts" }
gpui-icons = "0.7"
gpui = { version = "=0.2.2", default-features = false }
gpui-browser = { package = "gpui-unofficial", version = "=1.29.1", default-features = false }
# Shared dependencies keep plugin-to-plugin edges headless. GUI apps enable crate defaults.
gpdoc = { path = "crates/gpdoc", version = "0.1.0", default-features = false }
gpdoc-core = { path = "crates/gpdoc-core", version = "0.1.0" }
gpdoc-plugin-audio = { path = "plugins/audio", version = "0.1.0", default-features = false }
gpdoc-plugin-blockquote = { path = "plugins/blockquote", version = "0.1.0", default-features = false }
gpdoc-plugin-bold = { path = "plugins/bold", version = "0.1.0", default-features = false }
gpdoc-plugin-bubble-menu = { path = "plugins/bubble-menu", version = "0.1.0" }
gpdoc-plugin-bullet-list = { path = "plugins/bullet-list", version = "0.1.0", default-features = false }
gpdoc-plugin-character-count = { path = "plugins/character-count", version = "0.1.0" }
gpdoc-plugin-code-block = { path = "plugins/code-block", version = "0.1.0", default-features = false }
gpdoc-plugin-code-block-lowlight = { path = "plugins/code-block-lowlight", version = "0.1.0" }
gpdoc-plugin-collaboration = { path = "plugins/collaboration", version = "0.1.0", default-features = false }
gpdoc-plugin-collaboration-caret = { path = "plugins/collaboration-caret", version = "0.1.0", default-features = false }
gpdoc-plugin-details = { path = "plugins/details", version = "0.1.0", default-features = false }
