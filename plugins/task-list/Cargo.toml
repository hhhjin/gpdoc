[package]
name = "gpdoc-plugin-task-list"
version = "0.1.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "gpdoc support for task lists and task items"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin.workspace = true
gpdoc-plugin-list-item.workspace = true

[features]
gpui = ["dep:gpdoc", "dep:gpui", "dep:gpui-browser"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser = { workspace = true, optional = true }
