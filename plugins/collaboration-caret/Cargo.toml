[package]
name = "gpdoc-plugin-collaboration-caret"
version = "0.2.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Yrs awareness and remote selections for gpdoc"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin-collaboration.workspace = true
gpdoc-plugin.workspace = true
thiserror = "2"
yrs = "0.28.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["gpui"]
gpui = ["dep:gpdoc", "dep:gpui", "dep:gpui-browser", "gpdoc-plugin-collaboration/gpui"]

[dev-dependencies]
gpdoc-plugin-paragraph.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser = { workspace = true, optional = true }
