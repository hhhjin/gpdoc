[package]
name = "gpdoc-plugin-ordered-list"
version = "0.1.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Ordered list plugin for the gpdoc rich-text editor"

[features]
default = ["gpui"]
gpui = ["dep:gpdoc", "gpdoc-plugin-list-item/gpui"]

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin-list-item.workspace = true
gpdoc-plugin.workspace = true
