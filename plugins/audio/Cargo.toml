[package]
name = "gpdoc-plugin-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "Audio plugin for the gpdoc rich-text editor"

[features]
gpui = ["dep:gpdoc", "dep:gpui", "dep:gpui-browser"]

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
regex = "1"
gpdoc-plugin.workspace = true
url = "2.5.9"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser = { workspace = true, optional = true }
