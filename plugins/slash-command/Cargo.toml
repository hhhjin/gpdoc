[package]
name = "gpdoc-plugin-slash-command"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "Search and apply block commands from a slash menu in gpdoc"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin.workspace = true
gpdoc-plugin-suggestion.workspace = true

[features]
gpui = ["dep:gpdoc", "gpdoc-plugin-suggestion/gpui"]
