[package]
name = "gpdoc-plugin-suggestion"
version = "0.1.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Suggestion trigger matching and completion for the gpdoc rich-text editor"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin.workspace = true

[features]
gpui = ["dep:gpdoc", "dep:gpui", "dep:gpui-browser"]

[dev-dependencies]
gpdoc-plugin-paragraph.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser = { workspace = true, optional = true }
