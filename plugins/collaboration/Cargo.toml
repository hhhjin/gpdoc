[package]
name = "gpdoc-plugin-collaboration"
version = "0.1.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Yrs document synchronization and local collaborative undo for gpdoc"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin.workspace = true
yrs = "0.28.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
web-time = "1"

[features]
default = ["gpui"]
gpui = ["dep:gpdoc", "dep:gpui", "dep:gpui-browser"]

[dev-dependencies]
gpdoc-plugin-paragraph.workspace = true
gpdoc-plugin-bold.workspace = true
gpdoc-plugin-table.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser = { workspace = true, optional = true }
