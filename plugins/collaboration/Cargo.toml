[package]
name = "gpdoc-plugin-collaboration"
version = "0.2.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Yjs document synchronization and local collaborative undo for gpdoc"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin.workspace = true
once_cell = "1"
y-octo = "0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
default = ["gpui"]
gpui = ["dep:gpdoc", "dep:gpui", "dep:gpui-browser"]

[dev-dependencies]
gpdoc-plugin-paragraph = { path = "../paragraph", default-features = false }
gpdoc-plugin-bold = { path = "../bold", default-features = false }
gpdoc-plugin-table = { path = "../table", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# y-octo's rand and nanoid dependencies use different getrandom versions.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
gpui-browser = { workspace = true, optional = true }
