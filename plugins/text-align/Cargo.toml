[package]
name = "gpdoc-plugin-text-align"
version = "0.2.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Block text alignment for the gpdoc rich-text editor"

[features]
default = ["gpui"]
gpui = ["dep:gpdoc"]

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin.workspace = true

[dev-dependencies]
gpdoc-plugin-paragraph.workspace = true
