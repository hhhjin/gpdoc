[package]
name = "gpdoc-plugin-horizontal-rule"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "Horizontal rule plugin for the gpdoc rich-text editor"

[features]
gpui = ["dep:gpdoc"]

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
regex = "1"
gpdoc-plugin.workspace = true
