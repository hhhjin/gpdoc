[package]
name = "gpdoc-plugin-file-handler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "File handler plugin for gpdoc"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"] }
gpdoc-plugin.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser.workspace = true
