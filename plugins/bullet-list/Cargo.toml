[package]
name = "gpdoc-plugin-bullet-list"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "Bullet list plugin for the gpdoc rich-text editor"

[features]
gpui = ["dep:gpdoc", "gpdoc-plugin-list-item/gpui"]

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin.workspace = true
gpdoc-plugin-list-item.workspace = true
