[package]
name = "gpdoc-plugin-markdown"
version = "0.2.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "CommonMark import and export for gpdoc editors"

[dependencies]
gpdoc-plugin.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }
pulldown-cmark-to-cmark = "22"

[dev-dependencies]
gpdoc-plugin-heading = { path = "../heading", default-features = false }
gpdoc-plugin-blockquote = { path = "../blockquote", default-features = false }
gpdoc-plugin-ordered-list = { path = "../ordered-list", default-features = false }
gpdoc-plugin-list-item = { path = "../list-item", default-features = false }
gpdoc-plugin-bold = { path = "../bold", default-features = false }
gpdoc-plugin-italic = { path = "../italic", default-features = false }
gpdoc-plugin-link = { path = "../link", default-features = false }
gpdoc-plugin-inline-code = { path = "../inline-code", default-features = false }
gpdoc-plugin-code-block = { path = "../code-block", default-features = false }
gpdoc-plugin-strike = { path = "../strike", default-features = false }
gpdoc-plugin-horizontal-rule = { path = "../horizontal-rule", default-features = false }
gpdoc-plugin-paragraph = { path = "../paragraph", default-features = false }
serde_json = "1"
gpdoc-plugin-task-list = { path = "../task-list", default-features = false }
gpdoc-plugin-table = { path = "../table", default-features = false }
gpdoc-plugin-image = { path = "../image", default-features = false }
gpdoc-plugin-mathematics = { path = "../mathematics", default-features = false }
