[package]
name = "gpdoc-plugin-focus"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "Paint the block around the selection anchor while the editor has focus in GPUI"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser.workspace = true
