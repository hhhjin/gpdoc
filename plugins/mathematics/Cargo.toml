[package]
name = "gpdoc-plugin-mathematics"
version = "0.2.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Mathematics plugin for the gpdoc rich-text editor"

[features]
default = ["gpui"]
gpui = ["dep:gpdoc", "dep:gpui", "dep:gpui-browser"]

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin.workspace = true
regex = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser = { workspace = true, optional = true }
