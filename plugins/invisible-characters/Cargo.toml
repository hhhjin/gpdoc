[package]
name = "gpdoc-plugin-invisible-characters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "Mark spaces, line breaks, and paragraph ends without adding document content in GPUI"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"], optional = true }
gpdoc-plugin.workspace = true

[features]
gpui = ["dep:gpdoc", "dep:gpui", "dep:gpui-browser"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser = { workspace = true, optional = true }
