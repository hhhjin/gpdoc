[package]
name = "gpdoc-plugin-placeholder"
version = "0.1.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Show a writing hint inside empty text blocks in GPUI"

[dependencies]
gpdoc = { workspace = true, features = ["gpui"] }
gpdoc-plugin.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui-browser.workspace = true
