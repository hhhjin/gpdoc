[package]
name = "gpdoc-plugin-table-of-contents"
version = "0.2.0"
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Table Of Contents plugin for the gpdoc editor"

[dependencies]
gpdoc-plugin.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
gpdoc-plugin-paragraph = { path = "../paragraph", default-features = false }
gpdoc-plugin-heading = { path = "../heading", default-features = false }
